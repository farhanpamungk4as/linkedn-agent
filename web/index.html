<!doctype html>

<head>

  <title>LinkedIn Agent · Control Center</title>

</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div><strong>LinkedIn Agent</strong><small>CONTROL CENTER</small></div></div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Overview</button>
        <button class="nav-item" data-page="leads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Leads</button>
        <button class="nav-item" data-page="takeover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17 4 12l5-5"/><path d="M4 12h10a6 6 0 0 1 6 6v1"/></svg> Human Takeover</button>
        <button class="nav-item" data-page="pending"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h5l2 3h4l2-3h5"/></svg> Pending</button>
        <button class="nav-item" data-page="templates"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg> Templates</button>
        <button class="nav-item" data-page="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9-6-18-3 9H2"/></svg> Activity</button>
        <button class="nav-item" data-page="control"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg> Control center</button>
      </nav>
      <div class="sidebar-foot"><span class="live-dot"></span><span id="sidebar-worker">Worker status loading</span><small id="sidebar-automation">Checking automation</small></div>

    <div class="workspace">

      <main id="app" class="content"><div class="loading">Loading dashboard…</div></main>
    </div>
  </div>
  <div id="drawer-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
