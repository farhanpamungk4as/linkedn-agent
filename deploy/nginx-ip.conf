# Replace REPLACE_WITH_PUBLIC_IP before installing this file as an Nginx site.
server {
    listen 80;
    server_name REPLACE_WITH_PUBLIC_IP;

    location /.well-known/acme-challenge/ {
        root /var/www/linkedin-agent;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_PUBLIC_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
