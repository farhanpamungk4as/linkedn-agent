services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/leads.db
      APP_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
